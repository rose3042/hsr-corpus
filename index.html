function render(){

  const arr=tab==='terms'?D.terms:D.standards;
  const f=arr.filter(x=>{
    const s=tab==='terms'?((x.en||'')+(x.zh||'')+(x.category||'')):((x.no||'')+(x.title||'')+(x.category||''));
