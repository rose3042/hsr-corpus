<script>
const D={"terms": [{"en": "track", "zh": "轨道", "category": "轨道", "definition": "轨道是引导铁路机车车辆运行、直接承受并传递列车荷载至下部基础的结构，由钢轨、轨枕、连接零件、道床、道岔及附属设备等组成。", "example": "轨道结构应具有足够的强度、稳定性和平顺性，以满足列车安全平稳运行的要求。", "source": "GBT 36505-2018", "related": "", "id": 1}, {"en": "track types", "zh": "轨道类型", "category": "轨道", "definition": "轨道类型是按轨道结构形式、钢轨规格、轨枕配置及道床材料等对轨道进行的分类，分为有砟轨道和无砟轨道两大类。", "example": "设计单位应根据线路等级、设计速度及运营条件合理选择轨道类型。", "source": "GBT 36505-2018", "related": "", "id": 2}, {"en": "ballasted track", "zh": "有砟轨道", "category": "轨道", "definition": "有砟轨道是以碎石道床支承轨枕、通过道砟传递荷载并保持轨道几何形位的轨道结构形式，具有弹性好、造价低、便于维修等优点。", "example": "既有线提速改造中，有砟轨道应加强道床密实度和轨道几何尺寸的养护维修。", "source": "GBT 36505-2018", "related": "", "id": 3}, {"en": "ballastless track", "zh": "无砟轨道", "category": "轨道", "definition": "无砟轨道是以混凝土或沥青等材料替代散粒体道床、通过扣件系统将钢轨荷载传递至下部基础的整体式轨道结构，具有高平顺性和高稳定性。", "example": "高速铁路正线应采用无砟轨道，以确保轨道具有高平顺性和长期稳定性。", "source": "GBT 36505-2018", "related": "", "id": 4}, {"en": "track panel", "zh": "轨排", "category": "轨道", "definition": "轨排是由钢轨、轨枕及扣件组装而成的一段轨道单元，可在基地或现场预组装后运至线路进行铺设。", "example": "铺轨基地内应按照设计轨枕间距组装轨排，经检验合格后方可运往现场铺设。", "source": "GBT 36505-2018", "related": "", "id": 5}, {"en": "track gauge", "zh": "轨距", "category": "轨道", "definition": "轨距是钢轨顶面下一定距离处两股钢轨工作边之间的最小距离，标准轨距为1435mm，是铁路轨道最重要的几何参数之一。", "example": "直线地段轨距应符合标准轨距1435mm的要求，轨距偏差不得超过验收标准的规定值。", "source": "GBT 36505-2018", "related": "", "id": 6}, {"en": "gauge widening", "zh": "轨距加宽", "category": "轨道", "definition": "轨距加宽是在曲线地段将轨距适当增大的措施，用以补偿车辆通过曲线时转向架与轨道之间的几何关系偏差，减小轮轨间的横向力。", "example": "小半径曲线地段应按设计规定进行轨距加宽，加宽值应随曲线半径减小而增大。", "source": "GBT 36505-2018", "related": "", "id": 7}, {"en": "rail", "zh": "钢轨", "category": "轨道", "definition": "钢轨是轨道结构中直接支承和引导车轮运行的纵向受力构件，其断面呈工字形，由轨头、轨腰和轨底组成，承受列车荷载并传递至轨枕。", "example": "正线钢轨应采用60kg/m及以上规格的钢轨，其材质和力学性能应符合相关标准要求。", "source": "GBT 36505-2018", "related": "", "id": 8}, {"en": "standard length rail", "zh": "标准长度钢轨", "category": "轨道", "definition": "标准长度钢轨是按照国家或行业标准规定的定尺长度生产的钢轨，中国铁路标准长度钢轨为25m和100m两种规格。", "example": "普通线路应采用标准长度钢轨，以减少接头数量并便于施工和养护维修。", "source": "GBT 36505-2018", "related": "", "id": 9}, {"en": "shortened rail", "zh": "缩短轨", "category": "轨道", "definition": "缩短轨是长度短于标准长度钢轨的定尺钢轨，用于曲线地段内外股钢轨因曲线长度差而产生的接头相错调整。", "example": "曲线地段内股钢轨应采用缩短轨进行配轨，使内外股钢轨接头相错量不超过规定值。", "source": "GBT 36505-2018", "related": "", "id": 10}, {"en": "compromise rail", "zh": "异形钢轨", "category": "轨道", "definition": "异形钢轨是断面形状不同或轨型不同的两根钢轨之间的过渡连接钢轨，用于实现不同轨型的平顺衔接。", "example": "不同轨型衔接处应设置异形钢轨，以保证车轮从一种轨型平顺过渡到另一种轨型。", "source": "GBT 36505-2018", "related": "", "id": 11}, {"en": "guard rail; check rail", "zh": "护轨", "category": "轨道", "definition": "护轨是设置在基本轨内侧的附加钢轨，用于在桥梁、隧道、小半径曲线及道岔等区段约束车轮横向位移，防止列车脱轨。", "example": "桥上应设置护轨，护轨与基本轨之间的间隔应符合设计要求，以防止列车脱轨后产生严重后果。", "source": "GBT 36505-2018", "related": "", "id": 12}, {"en": "rail cant; rail inclination", "zh": "轨底坡", "category": "轨道", "definition": "轨底坡是钢轨底面相对于轨枕顶面或轨道平面的横向倾斜坡度，通常为1:40，使钢轨中心线与车轮踏面接触区合理匹配。", "example": "轨底坡宜设置为1:40，以保证车轮踏面与钢轨轨头的接触位置合理，减少轮轨磨耗。", "source": "GBT 36505-2018", "related": "", "id": 13}, {"en": "gauge face of rail", "zh": "钢轨工作边", "category": "轨道", "definition": "钢轨工作边是钢轨轨头内侧与车轮轮缘接触的垂直面，两股钢轨工作边之间的距离即为轨距。", "example": "轨距测量应以两股钢轨工作边之间的距离为准，测量位置应在钢轨顶面下规定距离处。", "source": "GBT 36505-2018", "related": "", "id": 14}, {"en": "rail joint gap", "zh": "轨缝", "category": "轨道", "definition": "轨缝是相邻两根钢轨端部之间预留的间隙，用于补偿钢轨因温度变化引起的伸缩，防止钢轨因温度应力过大而胀轨或断轨。", "example": "普通线路应根据当地最高和最低轨温计算轨缝值，确保轨缝在允许范围内变化。", "source": "GBT 36505-2018", "related": "", "id": 15}, {"en": "joint bar; splice bar; fish plate", "zh": "接头夹板", "category": "轨道", "definition": "接头夹板是安装在钢轨接头两侧、通过螺栓将两根钢轨端部连接固定的条形钢件，用于传递轮载并保持接头处钢轨的连续性。", "example": "接头夹板应与钢轨轨腰和轨底紧密贴合，螺栓应按规定的扭矩拧紧。", "source": "GBT 36505-2018", "related": "", "id": 16}, {"en": "compromise joint bar", "zh": "异形接头夹板", "category": "轨道", "definition": "异形接头夹板是用于连接两种不同轨型钢轨的接头夹板，其断面形状与两种钢轨的轨腰和轨底均能适配。", "example": "不同轨型钢轨连接处应采用异形接头夹板，确保接头强度满足列车荷载要求。", "source": "GBT 36505-2018", "related": "", "id": 17}, {"en": "rail joint", "zh": "钢轨接头", "category": "轨道", "definition": "钢轨接头是相邻两根钢轨端部通过接头夹板和螺栓连接或焊接形成的连接部位，是轨道结构的薄弱环节。", "example": "钢轨接头处应保持轨面平顺，接头错牙和低接头不得超过规定的限值。", "source": "GBT 36505-2018", "related": "", "id": 18}, {"en": "insulated joint", "zh": "绝缘接头", "category": "轨道", "definition": "绝缘接头是在钢轨接头处设置绝缘材料、使相邻钢轨之间电气隔离的接头，用于轨道电路区段的分界和信号系统的正常工作。", "example": "轨道电路区段分界处应设置绝缘接头，绝缘接头的绝缘电阻应满足信号系统要求。", "source": "GBT 36505-2018", "related": "", "id": 19}, {"en": "glued insulated joint", "zh": "胶接接头", "category": "轨道", "definition": "胶接接头是采用高强度胶粘剂和绝缘端板将钢轨端部胶接固化形成的绝缘接头，具有较高的整体强度和绝缘性能。", "example": "高速铁路正线应采用胶接接头，以提高接头的整体性和绝缘可靠性。", "source": "GBT 36505-2018", "related": "", "id": 20}, {"en": "welded joint", "zh": "焊接接头", "category": "轨道", "definition": "焊接接头是两根钢轨端部通过闪光焊、气压焊或铝热焊等焊接方法连接形成的接头，分为接触焊和移动焊两类。", "example": "无缝线路钢轨焊接接头应进行探伤检查，确保焊接质量符合验收标准。", "source": "GBT 36505-2018", "related": "", "id": 21}, {"en": "frozen joint", "zh": "冻结接头", "category": "轨道", "definition": "冻结接头是采用高强度螺栓和夹板将钢轨端部紧固连接、使接头阻力达到接近焊接接头水平的机械连接接头。", "example": "冻结接头应按规定扭矩拧紧螺栓，使接头阻力满足设计要求，减少接头处的轨道变形。", "source": "GBT 36505-2018", "related": "", "id": 22}, {"en": "compromise joint", "zh": "异形接头", "category": "轨道", "definition": "异形接头是两种不同轨型钢轨之间的连接接头，通过异形钢轨或异形接头夹板实现不同轨型的过渡连接。", "example": "站线与非正线衔接处存在不同轨型时，应设置异形接头以保证列车平顺通过。", "source": "GBT 36505-2018", "related": "", "id": 23}, {"en": "rail expansion joint", "zh": "钢轨伸缩调节器", "category": "轨道", "definition": "钢轨伸缩调节器是设置在无缝线路长轨条之间或长轨条与道岔之间、用于自动调节钢轨因温度变化产生伸缩位移的装置。", "example": "大跨度桥梁上的无缝线路应设置钢轨伸缩调节器，以释放钢轨温度伸缩位移。", "source": "GBT 36505-2018", "related": "", "id": 24}, {"en": "joint bolt; fish bolt", "zh": "接头螺栓", "category": "轨道", "definition": "接头螺栓是用于紧固接头夹板与钢轨的螺栓，分为普通接头螺栓和高强度接头螺栓，其强度等级和拧紧扭矩应符合标准规定。", "example": "接头螺栓应按规定的扭矩值拧紧，并定期检查其紧固状态，防止松动。", "source": "GBT 36505-2018", "related": "", "id": 25}, {"en": "fastening system", "zh": "扣件系统", "category": "轨道", "definition": "扣件系统是将钢轨固定在轨枕或轨道板上的连接部件总成，由弹条、螺栓、垫板、绝缘块等组成，提供扣压力和纵向阻力。", "example": "扣件系统应具有足够的扣压力和抗拔力，确保钢轨与轨枕或轨道板的可靠连接。", "source": "GBT 36505-2018", "related": "", "id": 26}, {"en": "clip", "zh": "扣压件", "category": "轨道", "definition": "扣压件是扣件系统中直接对钢轨施加扣压力的部件，通过弹条、扣板等将钢轨压紧在轨枕或轨道板上，防止钢轨纵向和横向位移，保持轨距稳定。", "example": "弹条式扣件的扣压件应具有足够的扣压力，以确保钢轨在温度力作用下不产生过量纵向爬行。", "source": "GBT 36505-2018", "related": "", "id": 27}, {"en": "elastic rail fastenings", "zh": "弹性扣件", "category": "轨道", "definition": "弹性扣件是利用弹性元件（如弹条、弹性垫板等）提供扣压力和弹性缓冲的钢轨扣件，能有效衰减振动、适应钢轨纵向位移，广泛应用于有砟和无砟轨道。", "example": "高速铁路正线应采用弹性扣件，其扣压力衰减率应满足设计使用年限内的性能稳定要求。", "source": "GBT 36505-2018", "related": "", "id": 28}, {"en": "direct fastenings", "zh": "不分开式扣件", "category": "轨道", "definition": "不分开式扣件是钢轨直接通过扣压件固定在轨枕或轨道板上、不设铁垫板的扣件形式，结构简单、零部件少，适用于混凝土枕及无砟轨道。", "example": "不分开式扣件取消了铁垫板，钢轨通过弹条直接扣压在混凝土枕承轨台上。", "source": "GBT 36505-2018", "related": "", "id": 29}, {"en": "indirect fastenings", "zh": "分开式扣件", "category": "轨道", "definition": "分开式扣件是钢轨先固定在铁垫板上、铁垫板再固定于轨枕的扣件形式，荷载经垫板传递，便于调整轨距和水平，多用于木枕线路及道岔区。", "example": "木枕地段宜采用分开式扣件，以便通过铁垫板调整轨距和钢轨高低。", "source": "GBT 36505-2018", "related": "", "id": 30}, {"en": "track spike", "zh": "道钉", "category": "轨道", "definition": "道钉是用于将钢轨或铁垫板固定在木枕上的钉类紧固件，分为普通道钉和螺纹道钉，依靠钉杆与木材的摩擦力提供抗拔阻力。", "example": "木枕线路中，道钉应垂直钉入枕木，钉入深度不得少于钉杆长度的三分之二。", "source": "GBT 36505-2018", "related": "", "id": 31}, {"en": "screw spike", "zh": "螺纹道钉", "category": "轨道", "definition": "螺纹道钉是钉杆带有螺纹的钢轨紧固件，旋入木枕后可提供比普通道钉更大的抗拔力和扣压力，常用于分开式扣件中固定铁垫板。", "example": "螺纹道钉旋入木枕前应先钻孔，孔径宜为钉杆直径的0.7～0.9倍，以保证连接强度。", "source": "GBT 36505-2018", "related": "", "id": 32}, {"en": "baseplate", "zh": "铁垫板", "category": "轨道", "definition": "铁垫板是设置在钢轨与轨枕之间的钢板构件，用于分散钢轨压力、调整轨底坡、提供轨距和水平调整能力，是分开式扣件的重要组成部分。", "example": "铁垫板应具有足够的刚度和强度，其底面应与轨枕承轨面密贴，不得有空隙。", "source": "GBT 36505-2018", "related": "", "id": 33}, {"en": "baseplate pad", "zh": "铁垫板下垫层", "category": "轨道", "definition": "铁垫板下垫层是设置在铁垫板与轨枕之间的弹性或调整垫层，用于提供弹性缓冲、调整轨道高低和绝缘，改善轨道受力状态。", "example": "铁垫板下垫层的厚度应根据轨道弹性需求选取，其压缩永久变形量应满足验收标准。", "source": "GBT 36505-2018", "related": "", "id": 34}, {"en": "rail pad", "zh": "轨下垫板", "category": "轨道", "definition": "轨下垫板是设置在钢轨轨底与铁垫板或轨枕承轨面之间的弹性垫板，用于提供轨道弹性、绝缘和缓冲，减小轮轨动力作用。", "example": "轨下垫板的静刚度应满足设计要求，其绝缘电阻不得小于规定值。", "source": "GBT 36505-2018", "related": "", "id": 35}, {"en": "rail brace", "zh": "轨撑", "category": "轨道", "definition": "轨撑是安装在钢轨外侧、与轨枕或挡肩连接的支撑构件，用于抵抗钢轨横向力、防止钢轨倾覆和轨距扩大，常用于小半径曲线及道岔区段。", "example": "小半径曲线地段应安装轨撑，以增强轨道框架横向稳定性，防止轨距扩大。", "source": "GBT 36505-2018", "related": "", "id": 36}, {"en": "gauge rod; gauge bar", "zh": "轨距拉杆", "category": "轨道", "definition": "轨距拉杆是连接左右两根钢轨的横向杆件，用于保持轨距、增强轨道框架刚度，防止钢轨横向移动，多用于曲线和道岔区段。", "example": "曲线地段可根据需要安装轨距拉杆，以控制轨距变化率不超过规定限值。", "source": "GBT 36505-2018", "related": "", "id": 37}, {"en": "sleeper; tie", "zh": "轨枕", "category": "轨道", "definition": "轨枕是支承钢轨、保持轨距并将荷载传递至道床或轨道板的基础构件，按材质分为木枕、混凝土枕和钢枕，按用途分为普通轨枕、岔枕和桥枕。", "example": "轨枕间距应根据钢轨类型和荷载条件确定，混凝土枕间距一般为600～650mm。", "source": "GBT 36505-2018", "related": "", "id": 38}, {"en": "wooden sleeper; wooden tie", "zh": "木枕", "category": "轨道", "definition": "木枕是以木材制成的轨枕，具有弹性好、易加工、绝缘性能好等优点，但耐久性差、易腐朽，需经防腐处理，多用于道岔区和特殊地段。", "example": "木枕应经防腐处理后方可使用，铺设时树心面应朝下，以减少开裂。", "source": "GBT 36505-2018", "related": "", "id": 39}, {"en": "concrete sleeper; concrete tie", "zh": "混凝土枕", "category": "轨道", "definition": "混凝土枕是以钢筋混凝土制成的轨枕，具有耐久性好、重量大、稳定性强等优点，分为普通混凝土枕和预应力混凝土枕，广泛用于铁路正线。", "example": "预应力混凝土枕应满足设计承载能力要求，其抗裂性能应经检验合格后方可铺设。", "source": "GBT 36505-2018", "related": "", "id": 40}, {"en": "switch sleeper", "zh": "岔枕", "category": "轨道", "definition": "岔枕是铺设于道岔区域的轨枕，长度较普通轨枕长且不等长，用于支承道岔各部件、保持道岔几何形位，分为木岔枕和混凝土岔枕。", "example": "道岔区岔枕的布置应严格按设计图施工，岔枕间距偏差不得超过规定值。", "source": "GBT 36505-2018", "related": "", "id": 41}, {"en": "bridge sleeper", "zh": "桥枕", "category": "轨道", "definition": "桥枕是铺设于桥梁上的轨枕，用于支承钢轨并将荷载传递至桥梁结构，通常采用木桥枕并经过防腐处理，需满足桥梁结构的特殊受力要求。", "example": "桥枕应用钩螺栓与钢梁固定，防止桥枕在列车荷载作用下发生纵向移动。", "source": "GBT 36505-2018", "related": "", "id": 42}, {"en": "ballast bed", "zh": "道床", "category": "轨道", "definition": "道床是铺设在轨枕下方、由道砟组成的轨道基础结构层，具有传递荷载、排水、缓冲和调整轨道几何形位等功能，分为面砟层和底砟层。", "example": "道床应保持清洁、密实，其断面形状应符合设计要求，以确保轨道纵向和横向阻力。", "source": "GBT 36505-2018", "related": "", "id": 43}, {"en": "ballast", "zh": "道砟", "category": "轨道", "definition": "道砟是用于铺设道床的碎石材料，应具有规定的级配、强度、耐磨性和抗冻性，按材质分为碎石道砟和筛选卵石道砟。", "example": "道砟的颗粒级配应符合标准要求，针片状颗粒含量不得超过规定限值。", "source": "GBT 36505-2018", "related": "", "id": 44}, {"en": "ballast thickness", "zh": "道床厚度", "category": "轨道", "definition": "道床厚度是指钢轨中心线下轨枕底面至道床底面的垂直距离，是保证道床承载能力和排水性能的重要参数，应根据轨道类型和荷载条件确定。", "example": "有砟轨道道床厚度应根据设计轴重和路基条件计算确定，正线一般不小于300mm。", "source": "GBT 36505-2018", "related": "", "id": 45}, {"en": "slab track", "zh": "板式无砟轨道", "category": "轨道", "definition": "板式无砟轨道是以预制混凝土轨道板为核心构件、通过CA砂浆或自密实混凝土调整层将轨道板支承于底座上的无砟轨道结构形式，具有高平顺性和少维修特点。", "example": "板式无砟轨道的轨道板铺设精度应满足轨道几何形位要求，相邻轨道板间高差不得超过0.5mm。", "source": "GBT 36505-2018", "related": "", "id": 46}, {"en": "bi-block ballastless track", "zh": "双块式无砟轨道", "category": "轨道", "definition": "双块式无砟轨道是由两个混凝土块通过钢筋桁架连接而成的双块式轨枕埋入混凝土道床板中形成的无砟轨道结构，整体性好、施工便捷。", "example": "双块式无砟轨道施工时，双块式轨枕的定位精度直接影响轨道几何形位，应采用专用测量系统控制。", "source": "GBT 36505-2018", "related": "", "id": 47}, {"en": "ballastless track with embedded sleeper", "zh": "轨枕埋入式无砟轨道", "category": "轨道", "definition": "轨枕埋入式无砟轨道是将预制轨枕（多为双块式轨枕）嵌入现浇混凝土道床板中、使轨枕与道床板形成整体的无砟轨道结构形式。", "example": "轨枕埋入式无砟轨道中，轨枕埋入深度应满足设计要求，以确保轨枕与道床板的可靠连接。", "source": "GBT 36505-2018", "related": "", "id": 48}, {"en": "track slab", "zh": "轨道板", "category": "轨道", "definition": "轨道板是板式无砟轨道中直接支承和固定钢轨的预制混凝土板，按结构分为CRTSⅠ型、Ⅱ型、Ⅲ型等，具有精确的承轨台和扣件安装接口。", "example": "轨道板预制时应严格控制承轨台的位置精度，其偏差不得超过±0.5mm。", "source": "GBT 36505-2018", "related": "", "id": 49}, {"en": "bi-block sleeper", "zh": "双块式轨枕", "category": "轨道", "definition": "双块式轨枕是由两个混凝土块体和连接两块的钢筋桁架组成的轨枕构件，用于双块式无砟轨道中，施工时埋入混凝土道床板形成整体结构。", "example": "双块式轨枕的钢筋桁架应具有足够的刚度，保证运输和施工过程中两块体间距不变。", "source": "GBT 36505-2018", "related": "", "id": 50}, {"en": "concrete track bed", "zh": "混凝土道床板", "category": "轨道", "definition": "混凝土道床板是双块式或轨枕埋入式无砟轨道中现场浇筑的钢筋混凝土板，用于支承和固定轨枕或双块式轨枕，并将荷载传递至底座。", "example": "混凝土道床板浇筑前应检查轨枕位置和扣件安装状态，浇筑后应及时养护。", "source": "GBT 36505-2018", "related": "", "id": 51}, {"en": "concrete base", "zh": "混凝土底座", "category": "轨道", "definition": "混凝土底座是板式无砟轨道中设置于道床板或轨道板下方的基础结构层，通过调整层与上部结构连接，并将荷载传递至路基或桥梁结构。", "example": "混凝土底座表面平整度应满足要求，以确保调整层厚度均匀和轨道结构受力合理。", "source": "GBT 36505-2018", "related": "", "id": 52}, {"en": "hydraulic supporting layer", "zh": "水硬性材料支承层", "category": "轨道", "definition": "支承于混凝土底座之上、由水硬性胶结材料与骨料拌和浇筑而成，为无砟轨道提供均匀支承和传力功能的轨道结构层。", "example": "水硬性材料支承层施工完成后，应进行表面平整度和强度检验，合格后方可铺设轨道板。", "source": "GBT 36505-2018", "related": "", "id": 53}, {"en": "concrete stopper", "zh": "凸形挡台", "category": "轨道", "definition": "设置于无砟轨道单元板式结构端部或梁端底座上的凸形混凝土构件，用于限制轨道板的纵向和横向位移，传递水平力。", "example": "凸形挡台与轨道板之间的间隙应采用弹性材料填充，以满足轨道结构的受力与变形要求。", "source": "GBT 36505-2018", "related": "", "id": 54}, {"en": "cement asphalt mortar", "zh": "水泥沥青砂浆", "category": "轨道", "definition": "由水泥、沥青乳液、砂及外加剂等按一定配合比拌和而成的灌注材料，用于板式无砟轨道板与底座之间，起支承、传力和调整作用。", "example": "水泥沥青砂浆灌注前应检查轨道板的定位精度，灌注过程中应保证砂浆的流动性和均匀性。", "source": "GBT 36505-2018", "related": "", "id": 55}, {"en": "continuously welded rail (CWR) track", "zh": "无缝线路", "category": "轨道", "definition": "用焊接方法将标准钢轨连接成长钢轨，并采取锁定措施使钢轨在温度变化时不能自由伸缩的轨道结构形式。", "example": "无缝线路的铺设应严格控制锁定轨温，确保钢轨内部温度力在允许范围内。", "source": "GBT 36505-2018", "related": "", "id": 56}, {"en": "long rail string", "zh": "长轨条", "category": "轨道", "definition": "由多根标准钢轨焊接而成、长度大于标准轨长的钢轨条，是无缝线路的基本组成单元，可分为工厂焊接长轨条和工地焊接长轨条。", "example": "长轨条在运输和铺设过程中应采取措施防止钢轨产生硬弯和损伤。", "source": "GBT 36505-2018", "related": "", "id": 57}, {"en": "deformation free zone in CWR", "zh": "固定区", "category": "轨道", "definition": "在无缝线路长轨条中，因两端受接头阻力或道床阻力约束，钢轨温度变化时不产生纵向位移的区段。", "example": "固定区内钢轨温度力随轨温变化而增减，但钢轨不产生纵向伸缩位移。", "source": "GBT 36505-2018", "related": "", "id": 58}, {"en": "breathing zone in CWR", "zh": "伸缩区", "category": "轨道", "definition": "在无缝线路长轨条两端，因温度变化钢轨产生纵向伸缩位移的区段，其长度取决于道床纵向阻力和温度力的大小。", "example": "伸缩区的长度应根据道床纵向阻力和钢轨温度力计算确定，并设置位移观测桩进行监测。", "source": "GBT 36505-2018", "related": "", "id": 59}, {"en": "buffer zone in CWR", "zh": "缓冲区", "category": "轨道", "definition": "在无缝线路伸缩区与普通钢轨接头之间设置的由数根标准钢轨组成的区段，用于调节钢轨温度伸缩量，减小接头受力。", "example": "缓冲区钢轨接头的轨缝应根据轨温变化及时调整，防止轨缝过大或顶死。", "source": "GBT 36505-2018", "related": "", "id": 60}, {"en": "trans-sectional continuously welded rail", "zh": "跨区间无缝线路", "category": "轨道", "definition": "区间无缝线路与车站无缝线路通过焊接或冻结接头连接，跨越车站或区间的无缝线路结构形式，消除了缓冲区。", "example": "跨区间无缝线路应加强锁定和监测，确保道岔区和桥梁等薄弱环节的稳定性。", "source": "GBT 36505-2018", "related": "", "id": 61}, {"en": "rail temperature", "zh": "钢轨温度", "category": "轨道", "definition": "钢轨在环境温度和日照等因素作用下所呈现的实际温度，是计算无缝线路温度力和确定锁定轨温的重要参数。", "example": "施工时应实时测量钢轨温度，以便确定合理的锁定轨温范围。", "source": "GBT 36505-2018", "related": "", "id": 62}, {"en": "highest rail temperature", "zh": "最高轨温", "category": "轨道", "definition": "钢轨在一年中可能出现的最高温度值，通常根据当地气象资料和线路条件确定，用于计算无缝线路的最大温度压力。", "example": "最高轨温是检算无缝线路稳定性的重要依据，应根据当地历年气象资料统计分析确定。", "source": "GBT 36505-2018", "related": "", "id": 63}, {"en": "lowest rail temperature", "zh": "最低轨温", "category": "轨道", "definition": "钢轨在一年中可能出现的最低温度值，通常根据当地气象资料和线路条件确定，用于计算无缝线路的最大温度拉力。", "example": "最低轨温用于检算钢轨强度和断缝宽度，确保无缝线路在低温条件下安全运营。", "source": "GBT 36505-2018", "related": "", "id": 64}, {"en": "allowable temperature drop range in CWR", "zh": "允许降温幅度", "category": "轨道", "definition": "无缝线路锁定轨温与最低轨温之差，即钢轨在降温过程中允许产生的温度拉力所对应的温度变化幅度。", "example": "允许降温幅度应根据钢轨强度和断缝检算确定，确保钢轨不因温度拉力过大而断裂。", "source": "GBT 36505-2018", "related": "", "id": 65}, {"en": "allowable temperature rise range in CWR", "zh": "允许升温幅度", "category": "轨道", "definition": "最高轨温与无缝线路锁定轨温之差，即钢轨在升温过程中允许产生的温度压力所对应的温度变化幅度。", "example": "允许升温幅度应满足无缝线路稳定性要求，防止钢轨因温度压力过大而发生胀轨跑道。", "source": "GBT 36505-2018", "related": "", "id": 66}, {"en": "fastening down temperature", "zh": "锁定轨温", "category": "轨道", "definition": "无缝线路锁定作业时的钢轨温度，即钢轨被完全约束、不能自由伸缩时的温度，是控制无缝线路温度力的关键参数。", "example": "锁定轨温的测定应在钢轨温度稳定时段进行，并做好记录作为运营维护的依据。", "source": "GBT 36505-2018", "related": "", "id": 67}, {"en": "neutral temperature", "zh": "中和轨温", "category": "轨道", "definition": "使无缝线路钢轨内部温度拉力和温度压力相等时的轨温，即锁定轨温与最高、最低轨温之间的中间温度值。", "example": "设计中通常以中和轨温为基准确定锁定轨温，使钢轨在升温和降温时受力均衡。", "source": "GBT 36505-2018", "related": "", "id": 68}, {"en": "longitudinal ballast resistance", "zh": "道床纵向阻力", "category": "轨道", "definition": "道床抵抗钢轨及轨枕沿线路纵向移动的阻力，由轨枕底面与道砟之间的摩擦力和道砟间的相互嵌制作用组成。", "example": "道床纵向阻力的大小直接影响无缝线路伸缩区的长度和钢轨温度力的分布。", "source": "GBT 36505-2018", "related": "", "id": 69}, {"en": "lateral ballast resistance", "zh": "道床横向阻力", "category": "轨道", "definition": "道床抵抗轨枕沿线路横向移动的阻力，由道砟与轨枕侧面及底面的摩擦力和道砟肩部的阻挡作用组成。", "example": "道床横向阻力是保证无缝线路横向稳定性的重要因素，应通过捣固和夯实予以保证。", "source": "GBT 36505-2018", "related": "", "id": 70}, {"en": "rail joint resistance", "zh": "钢轨接头阻力", "category": "轨道", "definition": "钢轨接头处夹板与钢轨之间的摩擦阻力，用于阻止钢轨端部纵向位移，是缓冲区钢轨接头设计的重要参数。", "example": "钢轨接头阻力不足时，应更换夹板或增加螺栓扭矩，以保证接头的正常使用。", "source": "GBT 36505-2018", "related": "", "id": 71}, {"en": "stability of CWR", "zh": "无缝线路稳定性", "category": "轨道", "definition": "无缝线路在温度压力作用下抵抗胀轨跑道的能力，取决于道床横向阻力、轨道框架刚度和初始弯曲等因素。", "example": "夏季高温时段应加强无缝线路稳定性检查，发现方向不良应及时整治。", "source": "GBT 36505-2018", "related": "", "id": 72}, {"en": "critical force in CWR", "zh": "临界温度力", "category": "轨道", "definition": "无缝线路在升温过程中，当钢轨温度压力达到某一数值时，轨道将失去稳定而发生胀轨跑道，该温度压力即为临界温度力。", "example": "临界温度力与道床横向阻力和轨道框架刚度密切相关，设计中应留有足够的安全储备。", "source": "GBT 36505-2018", "related": "", "id": 73}, {"en": "force due to the thermal expansion of the deck", "zh": "伸缩力", "category": "轨道", "definition": "桥梁因温度变化产生伸缩变形时，通过梁轨相互作用传递给无缝线路钢轨的纵向力。", "example": "伸缩力的大小与桥梁跨度、支座布置及线路锁定方式有关，设计时应进行检算。", "source": "GBT 36505-2018", "related": "", "id": 74}, {"en": "force due to the bridge bending under vertical traffic loads", "zh": "挠曲力", "category": "轨道", "definition": "列车荷载作用下桥梁产生竖向挠曲变形时，通过梁轨相互作用引起的钢轨纵向力。", "example": "挠曲力对桥上无缝线路的受力状态有重要影响，应结合桥梁刚度进行计算分析。", "source": "GBT 36505-2018", "related": "", "id": 75}, {"en": "force acting on the bridge due to breaking of the CWR", "zh": "断轨力", "category": "轨道", "definition": "桥上无缝线路钢轨发生断裂时，断轨处钢轨温度拉力突然释放，通过梁轨相互作用传递给桥梁的纵向力。", "example": "断轨力是桥上无缝线路设计的重要控制荷载之一，应确保桥梁墩台具有足够的承载能力。", "source": "GBT 36505-2018", "related": "", "id": 76}, {"en": "braking force of train", "zh": "制动力", "category": "轨道", "definition": "列车在制动过程中通过轮轨粘着作用施加于钢轨上的纵向力，经梁轨相互作用传递至桥梁结构。", "example": "制动力的大小与列车轴重、制动减速度和轮轨粘着系数有关，是桥梁设计的控制荷载之一。", "source": "GBT 36505-2018", "related": "", "id": 77}, {"en": "de-stressing in the CWR", "zh": "放散应力", "category": "轨道", "definition": "通过拉伸或压缩钢轨并使其在预定轨温下锁定，以消除或调整钢轨内部温度力的作业过程。", "example": "放散应力作业应在轨温接近锁定轨温时进行，作业后应及时锁定并记录实际锁定轨温。", "source": "GBT 36505-2018", "related": "", "id": 78}, {"en": "field welded joint of rail", "zh": "联合接头", "category": "轨道", "definition": "在铺轨现场将两根钢轨端部通过焊接形成的接头，通常采用闪光接触焊或铝热焊等方法，使钢轨连接成为连续长钢轨。", "example": "长钢轨铺设后，联合接头应进行超声波探伤检查，确保焊接质量符合验收标准。", "source": "GBT 36505-2018", "related": "", "id": 79}, {"en": "gapless (welded or glued) turnout", "zh": "无缝道岔", "category": "轨道", "definition": "道岔区钢轨接头全部焊接或胶接，使道岔与区间长钢轨连为一体，消除接头轨缝，提高道岔区轨道平顺性和行车平稳性的轨道结构。", "example": "高速铁路正线道岔应采用无缝道岔，道岔两端与区间长钢轨焊接连接。", "source": "GBT 36505-2018", "related": "", "id": 80}, {"en": "longitudinal displacement monitoring post", "zh": "纵向位移观测桩", "category": "轨道", "definition": "设置于无缝线路钢轨或轨道结构上，用于定期观测钢轨纵向位移量、监测无缝线路稳定性的固定测点标志。", "example": "无缝线路纵向位移观测桩应沿线路方向等间距设置，定期观测并记录钢轨纵向位移量。", "source": "GBT 36505-2018", "related": "", "id": 81}, {"en": "track irregularity", "zh": "轨道不平顺", "category": "轨道", "definition": "轨道实际几何位置偏离理想设计位置的偏差，包括轨距、水平、高低、方向、扭曲等偏差，是评价轨道平顺性和行车品质的重要指标。", "example": "轨道不平顺超过管理值时，应及时安排维修作业，恢复轨道几何形位。", "source": "GBT 36505-2018", "related": "", "id": 82}, {"en": "irregularity of unloaded track; irregularity without load", "zh": "静态不平顺", "category": "轨道", "definition": "在无列车荷载作用下测得的轨道几何形位偏差，反映轨道在自由状态下的平顺性状况，通常由轨道检查仪或人工检测获得。", "example": "静态不平顺检测应在无列车荷载条件下进行，检测结果用于评定轨道几何状态。", "source": "GBT 36505-2018", "related": "", "id": 83}, {"en": "irregularity of track under train load", "zh": "动态不平顺", "category": "轨道", "definition": "在列车荷载作用下测得的轨道几何形位偏差，反映轨道在实际运营条件下的平顺性状况，通常由轨道检查车在运行中检测获得。", "example": "轨道检查车检测的动态不平顺数据是评定线路养护维修质量的重要依据。", "source": "GBT 36505-2018", "related": "", "id": 84}, {"en": "cross level of track", "zh": "水平", "category": "轨道", "definition": "轨道同一横截面上左右两股钢轨顶面的相对高差，是衡量轨道横向平顺性的重要几何参数。", "example": "直线地段轨道水平偏差不应超过验收标准规定的限值，超限时应及时起道整正。", "source": "GBT 36505-2018", "related": "", "id": 85}, {"en": "alignment of track", "zh": "方向", "category": "轨道", "definition": "轨道中心线在水平面上的横向偏差，即钢轨侧面沿线路纵向的不平直程度，反映轨道的横向平顺性。", "example": "轨道方向不良会导致列车横向晃动加剧，应通过拨道作业予以整正。", "source": "GBT 36505-2018", "related": "", "id": 86}, {"en": "profile", "zh": "高低", "category": "轨道", "definition": "轨道纵向顶面沿线路方向的高低偏差，即钢轨顶面在纵断面上的不平顺程度，反映轨道的竖向平顺性。", "example": "轨道高低偏差过大将引起列车竖向振动，应通过起道和捣固作业进行整正。", "source": "GBT 36505-2018", "related": "", "id": 87}, {"en": "twist of track", "zh": "扭曲", "category": "轨道", "definition": "轨道同一横截面上两股钢轨顶面相对水平偏差沿线路纵向的变化率，即水平在短距离内的急剧变化，又称三角坑。", "example": "扭曲偏差超过限值时可能导致列车脱轨，应重点检查并优先安排维修。", "source": "GBT 36505-2018", "related": "", "id": 88}, {"en": "track quality index; TQI", "zh": "轨道质量指数", "category": "轨道", "definition": "由轨距、水平、高低、方向、扭曲等单项轨道几何不平顺标准差综合统计而成的指数，用于综合评价轨道区段整体平顺性质量。", "example": "该区段轨道质量指数TQI为8.5，表明轨道平顺性良好，可适当延长维修周期。", "source": "GBT 36505-2018", "related": "", "id": 89}, {"en": "track recording car", "zh": "轨道检查车", "category": "轨道", "definition": "装有轨道几何参数检测装置，在运行中连续测量和记录轨距、水平、高低、方向、扭曲等轨道不平顺的专用检测车辆。", "example": "轨道检查车每月对正线进行一次全面检测，检测数据作为编制维修计划的依据。", "source": "GBT 36505-2018", "related": "", "id": 90}, {"en": "comprehensive testing train", "zh": "综合检测列车", "category": "轨道", "definition": "集轨道几何、接触网、通信信号等多种检测功能于一体的专用列车，可在运行中同步检测多项基础设施技术状态。", "example": "综合检测列车定期对高速铁路全线进行综合检测，全面掌握各专业设备运用状态。", "source": "GBT 36505-2018", "related": "", "id": 91}, {"en": "track measurement instrument", "zh": "轨道检查仪", "category": "轨道", "definition": "用于静态测量轨道几何形位偏差的便携式检测仪器，可测量轨距、水平、高低、方向等参数，适用于轨道静态检查和验收。", "example": "维修作业完成后，应使用轨道检查仪对作业地段进行静态检查，确认轨道几何状态达标。", "source": "GBT 36505-2018", "related": "", "id": 92}, {"en": "base-pile control points III; CP III", "zh": "基桩控制网", "category": "轨道", "definition": "沿线路布设的高精度三维控制网，为轨道铺设和运营维护提供平面和高程基准，相邻点相对精度可达毫米级。", "example": "无砟轨道铺设前应完成基桩控制网CPⅢ的测设，作为轨道精调测量的基准。", "source": "GBT 36505-2018", "related": "", "id": 93}, {"en": "maintenance benchmark", "zh": "维护基桩", "category": "轨道", "definition": "沿线路设置的用于轨道几何状态日常维护检测和复测的高程及平面控制基准点，为轨道维修提供测量依据。", "example": "轨道维修前应依据维护基桩对线路进行复测，确定轨道实际几何形位偏差。", "source": "GBT 36505-2018", "related": "", "id": 94}, {"en": "suspended sleeper; empty sleeper", "zh": "空吊板", "category": "轨道", "definition": "轨枕底面与道床顶面之间出现空隙，轨枕未能与道床密贴支撑的现象，又称空板或吊板，会导致轨道刚度不均匀。", "example": "检查发现空吊板时应及时进行捣固作业，使轨枕与道床密贴，恢复道床支承刚度。", "source": "GBT 36505-2018", "related": "", "id": 95}, {"en": "mud-pumping", "zh": "翻浆冒泥", "category": "轨道", "definition": "路基基床或道床中的细粒土在列车动荷载作用下液化，沿道床空隙向上冒出的现象，会恶化道床性能并影响轨道稳定性。", "example": "该地段雨季出现翻浆冒泥病害，应采取换填道床和加强路基排水等措施进行整治。", "source": "GBT 36505-2018", "related": "", "id": 96}, {"en": "depressed joint", "zh": "低接头", "category": "轨道", "definition": "钢轨接头处因接头病害或道床支承不良，导致接头区钢轨顶面低于相邻钢轨顶面的现象，会引起接头区轮轨冲击加剧。", "example": "低接头处轮轨冲击力增大，应通过打磨钢轨端部或起道捣固予以整治。", "source": "GBT 36505-2018", "related": "", "id": 97}, {"en": "rail creeping", "zh": "爬行", "category": "轨道", "definition": "钢轨在列车纵向力作用下沿线路方向产生的纵向移动现象，会导致轨缝不均匀和接头病害，影响无缝线路稳定性。", "example": "应定期观测钢轨爬行量，爬行量超过规定值时应采取防爬措施进行整治。", "source": "GBT 36505-2018", "related": "", "id": 98}, {"en": "closed joint", "zh": "瞎缝", "category": "轨道", "definition": "钢轨接头处轨缝完全闭合、两根钢轨端部直接顶紧的现象，会使钢轨内部产生过大温度压应力，严重时导致胀轨跑道。", "example": "夏季高温时段应加强巡道检查，发现瞎缝应及时调整轨缝，防止胀轨跑道。", "source": "GBT 36505-2018", "related": "", "id": 99}, {"en": "track buckling", "zh": "胀轨跑道", "category": "轨道", "definition": "无缝线路钢轨内部温度压应力超过轨道框架横向阻力时，钢轨连同轨枕一起横向移动、轨道产生严重横向变形的现象，是危及行车安全的重大病害。", "example": "高温季节应加强无缝线路巡检，发现胀轨跑道迹象应立即采取限速或封锁措施。", "source": "GBT 36505-2018", "related": "", "id": 100}, {"en": "rail defect", "zh": "钢轨伤损", "category": "轨道", "definition": "钢轨在制造、铺设或运营过程中产生的各种损伤和缺陷，包括裂纹、核伤、剥离、掉块、磨耗超限等，影响行车   document.getElementById('out').innerHTML=f.map(x=>{
    if(tab==='terms')return '<div class="card"><div class="en">'+(x.en||'')+'</div><div class="zh">'+(x.zh||'')+'</div><span class="cat">'+(x.category||'')+'</span></div>';
    return '<div class="card"><div class="en"><a href="'+(x.url||'#')+'" target="_blank" style="color:#0F4C81;text-decoration:none">'+(x.no||'')+'</a></div><div class="zh">'+(x.title||'')+'</div><span class="cat">'+(x.category||'')+'</span></div>';
  }).join('');
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');tab=t.dataset.t;render();});
document.getElementById('q').oninput=render;render();
</script></body></html>
